name: Deploy data site (GitHub Pages)
# Builds the hash-prefix shards from the published NDJSON index and deploys them to Pages.
# Runs by hand (Run workflow) and automatically when site/ or the shared lookup code changes on main.
# Shards are NOT committed to git (about 100 MB raw); they only exist as the Pages artifact.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".
on:
  workflow_dispatch:
  # Redeploy automatically when the site pages or the lookup code the site serves change on main.
  # A data refresh stays manual (run it by hand after uploading a new data-latest release).
  push:
    branches: [main]
    paths:
      - "site/**"
      - "extension/lib/normalize.js"
      - "extension/lib/shards.js"
      - ".github/workflows/deploy-data-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as in GitHub's own Pages template: build uploads the artifact, deploy publishes it.
  # On Nov 24 deploy-pages failed four times right after a good upload: GitHub's artifact list showed
  # 0 artifacts (not visible yet), and on a re-run it showed 2 (the failed attempt's leftover + the new one).
  # So: the artifact name carries the run attempt (a full re-run never sees two), "Re-run failed jobs"
  # re-runs only deploy and reuses the one artifact, and deploy waits and tries once more by itself.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - id: name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download the published index (data-latest release)
        run: |
          mkdir -p build
          base="https://github.com/${{ github.repository }}/releases/download/data-latest"
          curl -fsSL "$base/meta.json" -o build/meta.json
          curl -fsSL "$base/index.ndjson.gz" -o build/index.ndjson.gz
          ls -l build
      - name: Verify the download matches its meta
        run: |
          python - <<'PY'
          import gzip, hashlib, json, sys
          m = json.load(open("build/meta.json"))
          if "ndjson" not in m:
              sys.exit("data-latest has no ndjson block: upload index.ndjson.gz and the new meta.json first")
          h = hashlib.sha256()
          with gzip.open("build/index.ndjson.gz", "rb") as f:
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  h.update(chunk)
          if h.hexdigest() != m["ndjson"]["sha256"]:
              sys.exit("sha256 mismatch: the index and meta.json are from different builds")
          print("ok", m["data_date"], m["ndjson"]["lines"], "lines")
          PY
      - name: Download the published H-1B data (h1b-latest release)
        run: |
          mkdir -p h1b
          base="https://github.com/${{ github.repository }}/releases/download/h1b-latest"
          curl -fsSL "$base/h1b_meta.json" -o h1b/h1b_meta.json
          curl -fsSL "$base/h1b.json" -o h1b/h1b.json
          python - <<'PY'
          import json, sys
          m = json.load(open("h1b/h1b_meta.json"))
          ok = len(m["years_fetched"]) >= 10 and not m.get("years_missing")
          print("h1b years:", m["years_fetched"], "missing:", m.get("years_missing"))
          sys.exit(0 if ok else "H-1B data looks thin; not publishing")
          PY
      - name: Build shards (E-Verify + H-1B)
        working-directory: data-pipeline
        run: python build_shards.py ../build ../_site --h1b ../h1b
      - name: Safety gate (never publish a thin site)
        run: |
          python - <<'PY'
          import json, os, sys
          m = json.load(open("_site/meta.json"))
          n = len(os.listdir("_site/" + m["shard_path"]))
          ok = m["name_keys"] >= 900000 and n == m["shards"] == 4096 and "h1b_full_fy" in m
          print("keys", m["name_keys"], "shard files", n)
          sys.exit(0 if ok else 1)
          PY
      - name: Build format-2 shards (rule E) into _site/v2
        working-directory: data-pipeline
        run: python build_shards_v2.py ../build ../_site/v2 --h1b ../h1b --report ../v2_report.json
      - name: Safety gate for format 2 (and the old tree must be untouched)
        run: |
          python - <<'PY'
          import json, os, sys
          old = json.load(open("_site/meta.json"))
          m = json.load(open("_site/v2/meta.json"))
          n = len(os.listdir("_site/v2/" + m["shard_path"]))
          size = sum(os.path.getsize(os.path.join(d, f)) for d, _, fs in os.walk("_site") for f in fs)
          print("v2 keys", m["name_keys"], "shard files", n, "| old keys", old["name_keys"], "| site MB", round(size / 1e6))
          ok = (m.get("format") == 2 and m["name_keys"] >= 1200000 and n == m["shards"] == 4096 and "h1b_full_fy" in m
                and old.get("format") != 2 and old["name_keys"] >= 900000
                and size < 600 * 1000 * 1000)       # well under GitHub's 1 GB limit; raise on purpose, not by accident
          sys.exit(0 if ok else 1)
          PY
      - name: Add the About page, the speed-test page and the lookup code it uses
        run: |
          cp site/index.html site/speedtest.html site/icon.svg site/favicon-32.png _site/
          mkdir -p _site/lib
          cp extension/lib/normalize.js extension/lib/shards.js extension/lib/normalize2.js extension/lib/shards2.js _site/lib/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ steps.name.outputs.artifact }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
      - name: Wait for GitHub's artifact list to catch up, then try once more
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
